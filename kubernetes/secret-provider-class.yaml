apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: todo-keyvault

spec:
  provider: azure

  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD

  parameters:
    usePodIdentity: "false"
    keyvaultName: "todo-app-key"

    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectVersion: ""

    tenantId: "ed2b9d78-db29-4be1-a1c6-b2f082c5156b"
